name: Build and Release Plugin

on:
  push:
    tags:
      - "v*" # Triggered when you push a tag like v1.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create clean ZIP package
        run: |
          mkdir ultimate-flexbox
          # Copy your plugin files into a folder named after your plugin slug
          rsync -av --exclude='.git*' --exclude='.github*' ./ package/ultimate-flexbox/
          cd package && zip -r ../boxwise.zip ultimate-flexbox/

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
